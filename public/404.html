<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Redirecting…</title>
    <script>
      // SPA fallback for hosts that serve a true 404 on deep links.
      // Stores the attempted URL, redirects to /, then main.tsx restores it.
      sessionStorage.setItem(
        "spa:redirect",
        window.location.pathname + window.location.search + window.location.hash,
      );
      window.location.replace("/");
    </script>
  </head>
  <body></body>
</html>
